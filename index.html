<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorios IFA - Cronograma de Imprenta</title>
    <meta name="description"
        content="Sistema de gestión de cronograma de imprenta para Laboratorios IFA. Visualiza y administra cronogramas por etapa, tiempos y tablas de productos.">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Unicons for Icons -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
</head>

<body>
    <div class="app-container" id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark">I</div>
                    <span class="logo-text">IMPRENTA</span>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" title="Colapsar menú">
                    <i class="uil uil-angle-left-b" id="toggle-icon"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <ul id="nav-list">
                    <!-- Nav items will be generated by JS -->
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">
                        <i class="uil uil-user"></i>
                    </div>
                    <div class="user-info sidebar-show-only">
                        <span class="user-name">Usuario Actual</span>
                        <span class="user-role">Invitado</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <header class="content-header">
                <h1 id="page-title">Bienvenido</h1>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="header-actions" id="header-actions" style="display:none;">
                        <div class="table-export-menu-wrap">
                            <button class="btn-dots" id="btn-export-dots" title="Opciones de exportación">
                                <i class="uil uil-ellipsis-v"></i>
                            </button>
                                <div class="export-dropdown" id="export-dropdown">
                                    <button class="export-option" id="btn-export-excel">Exportar a Excel (.csv)</button>
                                </div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="content-body" id="content-body">
                <!-- Content injected here -->
            </div>
        </main>
    </div>

    <!-- Filter panel (column filters for BT Imprenta) -->
    <div class="filter-panel" id="filter-panel">
        <div class="filter-panel-header">
            <input type="text" class="filter-search" id="filter-search" placeholder="Buscar valores..."
                autocomplete="off" />
            <div class="filter-panel-quickbtns">
                <button class="filter-qbtn" id="btn-filter-select-all">Seleccionar todos</button>
                <button class="filter-qbtn" id="btn-filter-select-none">Seleccionar ninguno</button>
            </div>
        </div>
        <div class="filter-panel-body" id="filter-panel-body"></div>
        <div class="filter-panel-footer">
            <button class="btn-filter-apply" id="btn-filter-apply">Aplicar</button>
        </div>
    </div>
    <!-- Autocomplete dropdown (global, appended to body) -->
    <div class="autocomplete-dropdown" id="autocomplete-dropdown" style="display:none;"></div>

    <!-- Right-click context menu -->
    <div id="ctx-menu">
        <button class="ctx-item danger" id="ctx-delete-row">
            <i class="uil uil-trash-alt"></i> Eliminar fila
        </button>
    </div>

    <!-- Gantt Dynamic Modal -->
    <div class="modal-overlay" id="gantt-modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="gantt-modal-close" title="Cerrar">&times;</button>
            <div id="gantt-modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>

</html>
